name: Update vim plugins

on:
  schedule:
    - cron: "0 21 * * 0-4" # before 6am JST on weekdays (Mon-Fri)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Run nvfetcher
        run: nix run nixpkgs#nvfetcher
      - name: Format generated sources
        run: nix fmt _sources/

      # PR を作る前にここで評価する。main に required status check が無いため
      # gh pr merge --auto は即マージし、後追いの check.yml は打ち切られる
      # (PR #62/#63 は作成 4 秒後にマージ済み)。CI を後ろに置いても意味が無い。
      - name: Check
        run: nix flake check

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore(deps): update vim-plugins"
          title: "chore(deps): update vim-plugins"
          body: "Automated vim plugin update via nvfetcher."
          branch: nvfetcher/vim-plugins
          labels: automerge

      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-operation == 'created'
        run: gh pr merge --auto --merge ${{ steps.cpr.outputs.pull-request-number }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Update nvfetcher sources

on:
  schedule:
    - cron: "0 21 * * 0-4" # before 6am JST on weekdays (Mon-Fri)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      # src.github entries ask the GitHub API for the latest release; unauthenticated,
      # a shared runner IP can already be over its 60 requests an hour.
      - name: Run nvfetcher
        run: nix run nixpkgs#nvfetcher
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Format generated sources
        run: nix fmt _sources/

      # GITHUB_TOKEN で作った PR と push からは他の workflow が起動せず、required check が
      # 報告されないまま auto-merge が止まる。App のトークンなら pull_request も push も起動する。
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      # 検証はここでせず PR に対して走る check.yml / darwin.yml / nixos.yml に任せる。
      # どれも required check なので auto-merge はそれを待つ。
      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "chore(deps): update nvfetcher sources"
          title: "chore(deps): update nvfetcher sources"
          body: "Automated update of the sources in nvfetcher.toml."
          branch: nvfetcher/sources
          labels: automerge

      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-operation == 'created'
        run: gh pr merge --auto --merge ${{ steps.cpr.outputs.pull-request-number }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

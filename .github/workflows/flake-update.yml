# flake.lock を毎朝更新して PR にする。
#
# 検証と cachix への push はこの PR に対して走る check.yml / darwin.yml / nixos.yml が
# 行い、required check なので auto-merge はそれを待つ。手元の switch はマージ後なら
# cache だけで済む。
name: Update flake inputs

on:
  schedule:
    - cron: "0 21 * * *" # 6am JST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Update flake.lock
        run: nix flake update

      # GITHUB_TOKEN で作った PR と push からは他の workflow が起動せず、required check が
      # 報告されないまま auto-merge が止まる。App のトークンなら pull_request も push も起動する。
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "chore(deps): update flake inputs"
          title: "chore(deps): update flake inputs"
          body: "Automated flake.lock update."
          branch: flake-update
          labels: automerge

      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-operation == 'created'
        run: gh pr merge --auto --merge ${{ steps.cpr.outputs.pull-request-number }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

# E14Gen6 を組んで cachix に載せる。仕組みは darwin.yml と同じで、本体は cached-build.yml。
name: Build (nixos)

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: nixos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nixos:
    uses: ./.github/workflows/cached-build.yml
    with:
      hosts: nixosConfigurations.E14Gen6
      build-runner: ubuntu-latest
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

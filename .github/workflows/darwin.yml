# darwin の「ビルド」を見て、組んだものを cachix に載せる。
#
# check.yml の nix flake check は ubuntu で回っていて、checks.eval-<host> のおかげで
# mac 2 台も「評価」はされる。ただし評価が通ってもビルドは落ちる: nixpkgs f496248 の
# _7zz 26.02 は darwin でのみコンパイルに失敗し、CI が緑のまま手元の switch が壊れた。
# 実機と同じ aarch64-darwin で toplevel を実際に組むところまでやらないと捕まらない。
#
# mac は 2 台とも組む。共通部分は cache から取れるので、2 台目の追加は仕事用の数
# パッケージ分で済み、work 機の switch も cache だけで終わる。
#
# main への push でも回すのは、main に直接コミットした変更を組むため。PR から来た
# マージは probe が cache に揃っていると見て build を飛ばす。
# path フィルタを付けないのは required check にしているため。付けると対象外の PR で
# check が報告されず、マージできなくなる。
#
# work 機の linux-builder は guest の設定を変えているので、guest (aarch64-linux の NixOS)
# は Hydra が組む darwin.linux-builder と別物になり、cache.nixos.org に無い。macos の
# runner には aarch64-linux の builder が無く platform mismatch で落ちるので、arm の
# ubuntu で先に guest を組んで cachix に載せ、darwin の build はそれを substitute する。
name: Build (darwin)

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: darwin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-builder:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      GUEST: .#darwinConfigurations.work-macbook-pro-m4-attm.config.nix.linux-builder.package.nixosConfig.system.build.toplevel
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
        with:
          hosts: darwinConfigurations.work-macbook-pro-m4-attm
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # cache に揃っていれば組まない。nix build は揃っていても closure を丸ごと落とすので、
      # cache-probe と同じ dry-run で先に確かめる
      - name: Build the guest when the cache lacks it
        run: |
          out=$(nix build --dry-run --option always-allow-substitutes true "$GUEST" 2>&1)
          echo "$out"
          if grep -q "will be built" <<<"$out"; then
            nix build --no-link --print-out-paths "$GUEST"
          fi

  darwin:
    needs: linux-builder
    # guest の job が落ちても darwin は回す。needs だけだと skip になり、required check は
    # skip を成功として扱うので、壊れたままマージできてしまう
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/cached-build.yml
    with:
      hosts: >-
        darwinConfigurations.private-macbook-pro-m3
        darwinConfigurations.work-macbook-pro-m4-attm
      build-runner: macos-26
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

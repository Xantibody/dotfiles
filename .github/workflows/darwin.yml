# darwin の「ビルド」を見て、組んだものを cachix に載せる。
#
# check.yml の nix flake check は ubuntu で回っていて、checks.eval-<host> のおかげで
# mac 2 台も「評価」はされる。ただし評価が通ってもビルドは落ちる: nixpkgs f496248 の
# _7zz 26.02 は darwin でのみコンパイルに失敗し、CI が緑のまま手元の switch が壊れた。
# 実機と同じ aarch64-darwin で toplevel を実際に組むところまでやらないと捕まらない。
#
# mac は 2 台とも組む。共通部分は cache から取れるので、2 台目の追加は仕事用の数
# パッケージ分で済み、work 機の switch も cache だけで終わる。
#
# main への push でも回すのは、main に直接コミットした変更を組むため。PR から来た
# マージは probe が cache に揃っていると見て build を飛ばす。
# path フィルタを付けないのは required check にしているため。付けると対象外の PR で
# check が報告されず、マージできなくなる。
name: Build (darwin)

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: darwin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  darwin:
    uses: ./.github/workflows/cached-build.yml
    with:
      hosts: >-
        darwinConfigurations.private-macbook-pro-m3
        darwinConfigurations.work-macbook-pro-m4-attm
      build-runner: macos-26
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

# Runs the same `just check` a developer runs, inside the flake's devShell, so CI and
# local can only disagree when the lock file does. Keep the job name `check`: it is
# the required status check, and renaming it silently drops the requirement.
name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # A ratchet recipe compares against LINT_BASE, which a shallow clone lacks.
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix develop --command just check
        env:
          # The commit a ratchet may not get worse than: the PR's base, or the previous tip of main.
          LINT_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
